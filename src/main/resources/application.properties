gg.jte.development-mode=true
spring.application.name=jte-tasks

# File-based H2 database - data survives application restarts
spring.datasource.url=jdbc:h2:file:./data/taskdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# H2 web console at /h2-console, for inspecting the database in a browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
